name: Seat maintenance

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  maintain-seats:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      APP_URL: ${{ vars.KAMENG_APP_URL || 'https://kamenglibrary1.vercel.app' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Process reservation expiry and attendance checks
        shell: bash
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not configured in GitHub Actions. Skipping this run."
            exit 0
          fi

          curl --fail-with-body --retry 2 --retry-delay 2 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/internal/cron/maintenance"
